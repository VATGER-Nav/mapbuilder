[project]
name = "mapbuilder"
version = "0.1.0"
description = "A builder for GRPlugin and Topsky Maps"
authors = [{ name = "Alex Legler", email = "alex@a3li.li" }]
requires-python = ">=3.11,<4,<3.16"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Jinja2>=3.1.6,<4",
    "shapely>=2.1.2,<3",
    "more-itertools>=10.8.0,<11",
    "rich>=14.3.3,<15",
    "lxml>=6.0.2,<7",
    "fiona>=1.10.1,<2",
    "pygeodesy>=26.2.26,<27",
    "xmltodict>=1.0.4,<2",
    "pydantic>=2.12.5,<3",
    "cachelib>=0.13.0",
]

[project.scripts]
mapbuilder = "mapbuilder.__main__:entry"

[dependency-groups]
dev = [
    "ruff==0.15.7",
    "lxml-stubs>=0.5,<0.6",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
preview = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "C90",   # mccabe
    "I",     # isort
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "EM",    # flake8-errmsg
    "ICN",   # flake8-import-conventions
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "SIM",   # flake8-simplify
    "TCH",   # flake8-typechecking
    "PTH",   # flake8-use-pathlib
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
    "TRY",   # tryceratops
    "FURB",  # refurb
]
ignore = ["COM812", "C901"]
